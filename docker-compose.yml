# 2 containers: Database (PostgreSQL) and Spring Boot Application
# Run: docker compose up -d --build

services:
  # 1. Database - PostgreSQL
  db:
    image: postgres:15
    container_name: construction-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: construction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "5432:5432" # Allows local DB tools to connect to PostgreSQL if needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Application - Spring Boot (Java)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construction-app
    ports:
      - "80:8080" # Map host port 80 to Spring Boot Tomcat port 8080
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: construction_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
