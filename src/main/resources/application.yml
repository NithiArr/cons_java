spring:
  application:
    name: construction-manager
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}

logging:
  level:
    org:
      springframework:
        security: DEBUG
